<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chateasy AI</title>
    <!-- Favicon -->
    <link rel="icon" id="favicon" type="image/png" href="https://i.pinimg.com/236x/55/6e/2e/556e2edc7518c0e5cb4d59aef6729b24.jpg">
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Ícones Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        /* --- Variáveis de Tema --- */
        :root {
            --bg-body: #09090b; /* Quase preto */
            --bg-sidebar: #121214;
            --bg-chat: #09090b;
            --bg-message-bot: #18181b; /* Zinco escuro */
            --bg-input: #18181b;
            --border-color: #27272a;
            --accent-color: #10a37f; /* Verde GPT */
            --accent-hover: #0d8c6d;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --radius-md: 12px;
            --radius-sm: 6px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --font-main: 'Inter', sans-serif;
        }

        /* --- Reset e Estilos Gerais --- */
        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #3f3f46 transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #3f3f46;
            border-radius: 20px;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        button {
            font-family: var(--font-main);
        }

        /* --- Container Principal --- */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: var(--bg-chat);
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: var(--text-primary);
            color: var(--bg-body);
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            margin-bottom: 20px;
            justify-content: center;
        }

        .new-chat-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-header h2 {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding-left: 5px;
        }

        .sidebar-chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-decoration: none;
            position: relative;
        }

        .sidebar-chat-item:hover {
            background: #27272a;
            color: var(--text-primary);
        }

        .sidebar-chat-item.active {
            background: #27272a;
            color: var(--text-primary);
            font-weight: 500;
        }

        .sidebar-chat-title {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
        }

        .delete-chat-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
            padding: 4px;
            border-radius: 4px;
        }

        .sidebar-chat-item:hover .delete-chat-btn,
        .sidebar-chat-item.active .delete-chat-btn {
            opacity: 1;
        }

        .delete-chat-btn:hover {
            color: #ef4444; /* Vermelho erro */
            background: rgba(239, 68, 68, 0.1);
        }

        /* --- Área Principal --- */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
        }

        .chat-display {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px; /* Espaço para o input */
            scroll-behavior: smooth;
        }

        /* Estado Vazio / Boas-vindas */
        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: var(--text-primary);
            animation: fadeIn 0.5s ease-out;
        }

        .empty-state h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Mensagens */
        .msg-container {
            width: 100%;
            padding: 24px 0;
            border-bottom: 1px solid transparent;
            animation: slideIn 0.3s ease-out;
        }

        .bot .msg-container {
            background: var(--bg-message-bot);
            border-bottom: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
        }

        .msg-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            padding: 0 20px;
            align-items: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px; /* Quadrado arredondado mais moderno */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            font-size: 20px;
            overflow: hidden;
        }

        .bot .avatar {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 0 15px rgba(16, 163, 127, 0.3);
        }

        .human .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-text {
            flex: 1;
            line-height: 1.7;
            font-size: 16px;
            color: #d1d5db;
        }
        
        /* Estilos para texto formatado */
        .message-text strong {
            font-weight: 600;
            color: #ffffff;
        }

        .message-text em {
            font-style: italic;
            color: #e4e4e7;
        }

        .message-text code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #fbbf24;
        }

        .message-text a {
            color: var(--accent-color);
            text-decoration: underline;
            transition: color 0.2s;
        }

        .message-text a:hover {
            color: var(--accent-hover);
        }
        
        /* Loading Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 0;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* --- Área de Input --- */
        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, transparent 0%, var(--bg-chat) 40%);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        .input-wrapper {
            width: 100%;
            max-width: 800px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            align-items: flex-end;
            box-shadow: var(--shadow-lg);
            transition: border-color 0.2s;
            position: relative;
        }

        .input-wrapper:focus-within {
            border-color: var(--text-secondary);
        }

        #input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            font-family: var(--font-main);
            resize: none;
            outline: none;
            max-height: 200px;
            line-height: 1.5;
            padding: 4px 0;
            margin-right: 40px; /* Espaço para o botão */
        }

        #input::placeholder {
            color: #52525b;
        }

        #sendBtn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 1;
        }

        #sendBtn:disabled {
            background: transparent;
            color: #52525b;
            cursor: not-allowed;
        }
        
        #sendBtn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .footer-links {
            margin-top: 10px;
            font-size: 12px;
            color: #52525b;
            text-align: center;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin: 0 8px;
            transition: color 0.2s;
        }
        
        .footer-links a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        /* --- Animações --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* --- Responsivo --- */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 60px; /* Colapsado */
                overflow: hidden;
                padding: 10px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            .new-chat-btn {
                width: auto;
                margin-bottom: 0;
                padding: 8px 12px;
            }
            .chat-history {
                display: none; /* Esconder histórico no mobile para simplificar */
            }
            .msg-content {
                padding: 0 15px;
                gap: 12px;
            }
            .avatar {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
            .message-text {
                font-size: 15px;
            }
            .input-area {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <button class="new-chat-btn" id="newChatBtn">
            <i class="ri-add-line"></i> Novo Chat
        </button>

        <div class="sidebar-header">
            <h2>Histórico</h2>
        </div>

        <div class="chat-history" id="chatHistory">
            <!-- Items inseridos via JS -->
        </div>
    </aside>

    <!-- Chat Principal -->
    <main class="main-chat">
        <div class="chat-display" id="messages-container">
            <!-- Estado Inicial -->
            <div class="empty-state">
                <h1>Chateasy AI</h1>
                <p>Estou pronto para ajudar. Pergunte qualquer coisa!</p>
            </div>
        </div>

        <!-- Área de Input -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="input" placeholder="Envie uma mensagem..." rows="1"></textarea>
                <button id="sendBtn" disabled aria-label="Enviar">
                    <i class="ri-send-plane-2-fill" id="sendIcon"></i>
                </button>
            </div>
            
            <div class="footer-links">
                <a href="https://github.com/lleonardo553/imersao-dev-alura-2025-aula-4" target="_blank"><i class="ri-github-fill"></i> GitHub</a>
                <span>•</span>
                <a href="https://www.linkedin.com" target="_blank"><i class="ri-linkedin-box-fill"></i> LinkedIn</a>
            </div>
        </div>
    </main>
</div>

<script>
    /* 
     * Configurações e Variáveis 
     * Mantendo a mesma lógica da API, mas refinando a UX
     */
    const API_URL = "https://bots.easy-peasy.ai/bot/f2da91a7-4424-4db5-9fc4-ae2f39e142d5/api";
    const API_KEY = "37db12ad-fc97-4c3f-933a-3d81d662a10f";
    const CHATS_STORAGE_KEY = 'chateasy_pro_chats';
    const CURRENT_CHAT_KEY = 'chateasy_pro_current';
    const USER_IMAGE_URL = "https://i.pinimg.com/236x/55/6e/2e/556e2edc7518c0e5cb4d59aef6729b24.jpg";

    let currentChatId = null;
    let chats = {};

    const elements = {
        input: document.getElementById("input"),
        sendBtn: document.getElementById("sendBtn"),
        sendIcon: document.getElementById("sendIcon"),
        messagesContainer: document.getElementById("messages-container"),
        chatHistory: document.getElementById("chatHistory"),
        newChatBtn: document.getElementById("newChatBtn"),
        favicon: document.getElementById("favicon"),
    };

    // --- Inicialização ---
    function init() {
        const storedChats = localStorage.getItem(CHATS_STORAGE_KEY);
        if (storedChats) {
            try { chats = JSON.parse(storedChats); } catch (e) { chats = {}; }
        }
        
        // Recuperar último chat ou criar novo
        const lastId = sessionStorage.getItem(CURRENT_CHAT_KEY);
        if(lastId && chats[lastId]) {
            loadChat(lastId);
        } else {
            startNewChat();
        }

        renderChatHistory();
        
        // Auto-focus no input (UX)
        if(window.innerWidth > 768) elements.input.focus();
    }

    // --- Gerenciamento de Dados ---
    function saveAllChats() {
        localStorage.setItem(CHATS_STORAGE_KEY, JSON.stringify(chats));
        renderChatHistory();
    }

    function startNewChat() {
        // Limpar chats vazios anteriores
        Object.keys(chats).forEach(id => {
            if (chats[id].history.length === 0 && id !== currentChatId) delete chats[id];
        });

        currentChatId = Date.now().toString();
        chats[currentChatId] = { title: "Novo Chat", history: [] };
        
        saveAllChats();
        sessionStorage.setItem(CURRENT_CHAT_KEY, currentChatId);
        
        // UI Reset
        elements.messagesContainer.innerHTML = `
            <div class="empty-state">
                <h1>Chateasy AI</h1>
                <p>Estou pronto para ajudar. Pergunte qualquer coisa!</p>
            </div>`;
        renderChatHistory();
    }

    // --- Renderização da UI ---
    function renderChatHistory() {
        elements.chatHistory.innerHTML = '';
        const sortedIds = Object.keys(chats).sort((a, b) => b - a);

        sortedIds.forEach(id => {
            const chat = chats[id];
            // Não mostrar chats vazios a menos que seja o atual
            if(chat.history.length === 0 && id !== currentChatId) return;

            const item = document.createElement("a");
            item.className = `sidebar-chat-item ${id === currentChatId ? 'active' : ''}`;
            
            // Ícone + Título
            const titleGroup = document.createElement('div');
            titleGroup.className = 'sidebar-chat-title';
            titleGroup.innerHTML = `<i class="ri-message-3-line"></i> <span>${chat.title}</span>`;
            
            // Botão Excluir
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-chat-btn";
            deleteBtn.innerHTML = '<i class="ri-delete-bin-line"></i>';
            deleteBtn.title = "Excluir conversa";
            deleteBtn.onclick = (e) => {
                e.stopPropagation(); // Evita abrir o chat ao clicar em excluir
                e.preventDefault();
                deleteChat(id);
            };

            item.appendChild(titleGroup);
            item.appendChild(deleteBtn);
            
            item.onclick = () => loadChat(id);
            elements.chatHistory.appendChild(item);
        });
    }

    function loadChat(chatId) {
        currentChatId = chatId;
        sessionStorage.setItem(CURRENT_CHAT_KEY, currentChatId);
        
        const chat = chats[chatId];
        elements.messagesContainer.innerHTML = '';

        if (chat.history.length === 0) {
            elements.messagesContainer.innerHTML = `
            <div class="empty-state">
                <h1>Chateasy AI</h1>
                <p>Como posso ajudar você hoje?</p>
            </div>`;
        } else {
            chat.history.forEach(msg => {
                appendMessageToUI(msg.text, msg.type, false);
            });
            scrollToBottom();
        }
        renderChatHistory();
    }

    function deleteChat(id) {
        if(confirm("Deseja apagar este histórico?")) {
            delete chats[id];
            if(id === currentChatId) startNewChat();
            else saveAllChats();
        }
    }

    // --- Lógica de Mensagens ---
    function formatText(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\n/g, "<br>")
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")  // **negrito**
            .replace(/\*(.*?)\*/g, "<em>$1</em>")              // *itálico*
            .replace(/`(.*?)`/g, "<code>$1</code>")           // `código`
            .replace(/#{1,6}\s+(.*?)(?:\n|$)/g, "")           // Remove headers #
            .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>'); // links
    }

    function appendMessageToUI(text, type, animate = true) {
        // Remover empty state se existir
        const emptyState = elements.messagesContainer.querySelector('.empty-state');
        if(emptyState) emptyState.remove();

        const container = document.createElement("div");
        container.className = `msg-container ${type}`;
        
        let avatarHTML = '';
        if(type === 'bot') {
            avatarHTML = `<div class="avatar"><i class="ri-openai-fill"></i></div>`;
        } else {
            avatarHTML = `<div class="avatar"><img src="${USER_IMAGE_URL}" alt="User"></div>`;
        }

        container.innerHTML = `
            <div class="msg-content">
                ${avatarHTML}
                <div class="message-text">${formatText(text)}</div>
            </div>
        `;

        elements.messagesContainer.appendChild(container);
        if(animate) scrollToBottom();
        
        return container.querySelector('.message-text');
    }

    function showTypingIndicator() {
        const container = document.createElement("div");
        container.className = `msg-container bot typing-wrapper`;
        container.innerHTML = `
            <div class="msg-content">
                <div class="avatar"><i class="ri-openai-fill"></i></div>
                <div class="typing-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        `;
        elements.messagesContainer.appendChild(container);
        scrollToBottom();
        return container;
    }

    function typeWriterEffect(element, text) {
        return new Promise(resolve => {
            element.innerHTML = ""; // Limpa para começar a digitar
            let i = 0;
            const speed = 10; // Velocidade de digitação
            
            function type() {
                if (i < text.length) {
                    // Tratamento básico para <br>
                    if(text.substring(i, i+4) === "<br>") {
                        element.innerHTML += "<br>";
                        i += 4;
                    } else {
                        element.innerHTML += text.charAt(i);
                        i++;
                    }
                    scrollToBottom();
                    setTimeout(type, speed);
                } else {
                    resolve();
                }
            }
            type();
        });
    }

    function scrollToBottom() {
        const display = elements.messagesContainer;
        display.scrollTop = display.scrollHeight;
    }

    // --- Lógica de Envio (API) ---
    async function handleSend() {
        const message = elements.input.value.trim();
        if (!message) return;

        // UI Reset
        elements.input.value = "";
        elements.input.style.height = "auto";
        elements.sendBtn.disabled = true;

        // Adiciona mensagem do usuário
        appendMessageToUI(message, "human");
        
        // Salva histórico
        if(!chats[currentChatId]) startNewChat();
        chats[currentChatId].history.push({ type: "human", text: message });

        // Define título se for primeira mensagem
        if(chats[currentChatId].title === "Novo Chat") {
            chats[currentChatId].title = message.slice(0, 25) + (message.length > 25 ? "..." : "");
            saveAllChats();
        }

        // Mostra "Digitando..."
        const typingContainer = showTypingIndicator();

        try {
            // Prepara contexto
            const context = chats[currentChatId].history.map(h => ({ type: h.type, text: h.text }));

            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "content-type": "application/json",
                    "x-api-key": API_KEY
                },
                body: JSON.stringify({
                    message: message,
                    history: context
                })
            });

            const data = await response.json();
            const botReply = data.bot?.text || data.text || "Desculpe, não consegui processar a resposta.";

            // Remove loading e adiciona mensagem real
            typingContainer.remove();
            const textElement = appendMessageToUI(botReply, "bot", true);
            
            // Efeito de digitação (opcional, visualmente agradável)
            await typeWriterEffect(textElement, formatText(botReply));

            // Salva resposta
            chats[currentChatId].history.push({ type: "bot", text: botReply });
            saveAllChats();

        } catch (error) {
            typingContainer.remove();
            appendMessageToUI("Erro ao conectar com a IA. Tente novamente.", "bot");
            console.error(error);
        } finally {
            elements.sendBtn.disabled = false;
            // Atualiza ícone
            elements.sendIcon.className = "ri-send-plane-2-fill";
            elements.input.focus();
        }
    }

    // --- Event Listeners ---
    elements.sendBtn.addEventListener("click", handleSend);

    elements.input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    elements.input.addEventListener("input", function() {
        // Auto-grow textarea
        this.style.height = "auto";
        this.style.height = (this.scrollHeight) + "px";
        
        // Habilita/Desabilita botão
        elements.sendBtn.disabled = this.value.trim() === "";
        if(this.value.trim() !== "") {
            elements.sendBtn.style.opacity = "1";
        } else {
            elements.sendBtn.style.opacity = "0.5";
        }
    });

    elements.newChatBtn.addEventListener("click", startNewChat);

    // Iniciar
    window.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
